name: AetherSat-SIL CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libzmq3-dev \
            python3 \
            python3-pip

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages -r ground_station/requirements.txt

      - name: Configure and build with CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Run C++ GoogleTest suite
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Python E2E integration tests
        run: |
          pytest -v

  docker-build:
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t aethersat-sil:ci .

      - name: Run E2E tests inside container
        run: |
          docker run --rm --entrypoint pytest aethersat-sil:ci -v
